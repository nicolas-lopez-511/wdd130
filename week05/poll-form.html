<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form practice Web</title>
    <meta name="description" content="This is gonna be the way I'm gponna practive the form activity">
    <meta name="author" content="Nicolas Lopez">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item label-narrow">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item label-narrow">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item label-wide">
                    <label for="browser">What is your favorite internet browser?</label>
                    <select name="browser" id="browser">
                    <option value="1">Mozilla Firefox</option>
                    <option value="2">Google Chrome</option>
                    <option value="3">Safari</option>
                    <option value="4">Duck Go</option>
                    <option value="5">Other</option>    
                    </select>
                </div>    
                <div class="form-item label-wide">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="form-item">
                    <label for="places">List the places you have lived:</label>
                    <textarea id="places" name="places" rows="3" placeholder="Argentina, Bolivia, Peru, Colombia, Brazil, Honduras...etc."></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p><p>&copy;2026 &#10070; Nicolas Lopez Cespedes &#10070; Cochabamba, Bolivia</p>
    </footer>
</body>
</html>
